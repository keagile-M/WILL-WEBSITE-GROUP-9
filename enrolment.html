  <h1>Student Enrolment Form</h1>
   <p>Please complete the form below to enrol in your chosen course.</p>
    <form action="#" method="post">
         <h3>Personal Information</h3> 
         <label for="fullname">Full Name:</label>
         <br> <input type="text" id="fullname" name="fullname" required> <br>
         <br> <label for="email">Email Address:</label>
         <br> <input type="email" id="email" name="email" required> <br>
         <br> <label for="phone">Phone Number:</label><br>
          <input type="tel" id="phone" name="phone" required> <br>
          <br> <h3>Course Information</h3> 
          <label for="course">Select Your Course:</label>
          <br> <select id="course" name="course" required>
             <option value="">Choose a course</option> 
             <option value="puppy">Puppy Kindergarten & Socialization</option> 
             <option value="obedience">Basic Obedience & Manner Training</option>
              <option value="agility">Agility Foundations & Obstacles</option> 
              <option value="citizen">Canine Good Citizen Preparation</option> 
              <option value="rehabilitation">Reactive Dog Rehabilitation</option>
             <option value="tricks">Advanced Tricks & Cognitive Learning</option>
             </select> <br>
            
              <br> <label for="message">Additional Information:</label><br>
               <textarea id="message" name="message" rows="4" cols="30"></textarea>
                <br><br> <input type="checkbox" id="terms" name="terms" required>
                 <label for="terms">I confirm that the information provided is correct.</label> 
                 <br><br> <button type="submit">Submit Enrolment</button> 
                </form>
